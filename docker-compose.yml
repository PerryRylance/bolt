services:
  php-cli:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    tty: true
    stdin_open: true

  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_USER: pest
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: testing
    ports:
      - "3306:3306"

  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_USER: pest
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: testing
    ports:
      - "3307:3306"

  pgsql:
    image: postgres:latest
    environment:
      POSTGRES_USER: pest
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testing
    ports:
      - "5432:5432"

